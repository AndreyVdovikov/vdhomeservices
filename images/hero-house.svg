      <path d="M8 -200 C-20 -250 -60 -270 -105 -262 C-60 -250 -30 -235 8 -200Z"/>
      <path d="M8 -200 C20 -255 60 -280 105 -272 C60 -258 35 -238 8 -200Z"/>
      <path d="M8 -200 C45 -235 95 -228 125 -192 C85 -210 50 -207 8 -200Z"/>
      <path d="M8 -200 C-5 -240 -5 -275 -22 -300 C5 -270 12 -240 8 -200Z"/>
    </g>
    <g fill="#23702f"><path d="M8 -200 C-40 -210 -85 -180 -100 -150 C-60 -178 -30 -190 8 -200Z"/><path d="M8 -200 C55 -212 100 -182 112 -150 C75 -178 40 -190 8 -200Z"/></g>
