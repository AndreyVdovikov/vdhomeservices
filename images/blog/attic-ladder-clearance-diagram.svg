<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Side view of a room showing the ceiling height range and the floor space needed under a folding attic ladder">
<rect width="1200" height="800" fill="#f4f8fc"/>
<rect x="0" y="120" width="1200" height="40" fill="#cfd9e6"/>
<text x="40" y="146" font-family="Arial,sans-serif" font-size="22" fill="#1e3a5f">Ceiling</text>
<rect x="0" y="690" width="1200" height="110" fill="#e3d6c3"/>
<text x="40" y="735" font-family="Arial,sans-serif" font-size="22" fill="#5a4630">Floor</text>
<rect x="330" y="120" width="130" height="40" fill="#f4f8fc"/>
<line x1="330" y1="120" x2="330" y2="160" stroke="#1e3a5f" stroke-width="3"/>
<line x1="460" y1="120" x2="460" y2="160" stroke="#1e3a5f" stroke-width="3"/>
<text x="340" y="190" font-family="Arial,sans-serif" font-size="20" fill="#1e3a5f">Opening</text>
<line x1="440" y1="160" x2="900" y2="690" stroke="#2563a8" stroke-width="14" stroke-linecap="round"/>
<line x1="470" y1="150" x2="930" y2="680" stroke="#2563a8" stroke-width="14" stroke-linecap="round" opacity=".45"/>
<g stroke="#1e3a5f" stroke-width="3" fill="none">
<line x1="150" y1="160" x2="150" y2="690"/><line x1="135" y1="160" x2="165" y2="160"/><line x1="135" y1="690" x2="165" y2="690"/>
<line x1="440" y1="760" x2="900" y2="760"/><line x1="440" y1="745" x2="440" y2="775"/><line x1="900" y1="745" x2="900" y2="775"/>
<line x1="440" y1="640" x2="1040" y2="640" stroke-dasharray="10 8"/><line x1="1040" y1="625" x2="1040" y2="655"/>
</g>
<g font-family="Arial,sans-serif" fill="#1e3a5f">
<text x="175" y="400" font-size="30" font-weight="700">A</text>
<text x="175" y="438" font-size="22">Ceiling height</text>
<text x="175" y="468" font-size="22">7'8" to 10'3"</text>
<text x="540" y="748" font-size="24" font-weight="700">B: 67" clear from the opening to the foot</text>
<text x="175" y="590" font-size="20">C: 74" needed while</text><text x="175" y="616" font-size="20">the sections unfold</text>
</g>
<text x="40" y="60" font-family="Georgia,serif" font-size="38" font-weight="700" fill="#1e3a5f">Attic ladder: how much room it needs</text>
<text x="40" y="90" font-family="Arial,sans-serif" font-size="20" fill="#4a5d73">Typical 22.5" x 54" aluminum folding ladder. Always check your model's manual.</text>
</svg>
